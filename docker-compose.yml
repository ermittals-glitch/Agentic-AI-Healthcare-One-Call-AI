services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: onecall-n8n
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Chicago
      TZ: America/Chicago
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files/data
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NEBIUS_API_KEY: ${NEBIUS_API_KEY}
      NEBIUS_MODEL: ${NEBIUS_MODEL}
      ONECALL_DEBUG_TRACE: ${ONECALL_DEBUG_TRACE:-false}
    volumes:
      - onecall_n8n_data:/home/node/.n8n
      - ./data:/files/data:ro
      - ./workflows:/files/workflows:ro

volumes:
  onecall_n8n_data:
    external: true
